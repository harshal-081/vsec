
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Color Squares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 class="welcome">Welcome to my<br>Website</h2>

        <div class="grid">
            <button class="square red" aria-label="Red square"></button>
            <button class="square blue" aria-label="Blue square"></button>
            <button class="square green" aria-label="Green square"></button>
            <button class="square orange" aria-label="Orange square"></button>
        </div>
    </div>

    <script>
        const squares = document.querySelectorAll(".square");

        squares.forEach(function(square) {
            square.addEventListener("click", function() {
                square.classList.toggle("moved");
            });
        });
    </script>

</body>
</html>
